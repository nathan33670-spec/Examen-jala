name: Application Android

# Construit l'application Android (APK à installer, AAB pour le Play Store) et publie une release GitHub.
# Déclenchement : modifier le numéro de version dans android/VERSION (ex. 1.2.0) et pousser,
# pousser un tag de version (ex. `git tag v1.2.0 && git push origin v1.2.0`),
# ou lancer le workflow à la main (onglet Actions) en indiquant la version.
#
# Signature Play Store : ajouter dans Settings > Secrets and variables > Actions les secrets
#   ANDROID_KEYSTORE_BASE64   (fichier .jks encodé en base64 : base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sans ces secrets, les fichiers sont signés avec une clé de test jetable : l'APK s'installe sur un
# téléphone, mais l'AAB ne peut pas être envoyé sur le Play Store.

on:
  push:
    # branches : publication quand android/VERSION change ; tags : les filtres de chemin ne s'y appliquent pas
    branches: ['**']
    tags: ['v*']
    paths: ['android/VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex. 1.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: v
        env:  # valeurs passées par l'environnement, jamais interpolées dans le script (injection)
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then RAW="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then RAW="$REF_NAME"
          else RAW="$(tr -d ' \n\r' < android/VERSION)"; fi
          VERSION="${RAW#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version invalide : $RAW (attendu : 1.2.3)"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Contenu valide et fichiers générés à jour
        run: |
          pip install -r bot/requirements.txt
          python scripts/build_site.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Copie de l'application web dans le projet Android
        run: |
          npm ci
          npx cap sync android

      - name: Clé de signature
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            # retours à la ligne, espaces et retours chariot ajoutés au copier-coller sont ignorés
            CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')"
            if ! printf '%s' "$CLEAN" | base64 -d > "$KS" 2>/dev/null; then
              echo "::error::Le secret ANDROID_KEYSTORE_BASE64 n'est pas du base64 valide. Recréez-le avec : base64 -i upload.jks | tr -d '\n' (macOS) ou base64 -w0 upload.jks (Linux), puis collez tout le résultat."
              exit 1
            fi
            if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Keystore illisible : vérifiez ANDROID_KEYSTORE_PASSWORD (et que le secret contient bien le fichier .jks encodé en base64)."
              exit 1
            fi
            if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Alias « $KEY_ALIAS » absent du keystore : vérifiez ANDROID_KEY_ALIAS (alias choisi avec keytool -alias)."
              exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Prepa JA (cle de test)" -noprompt
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
              echo "ANDROID_KEY_ALIAS=test"
              echo "ANDROID_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents : clé de test jetable (AAB non publiable sur le Play Store)."
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Construction (APK et AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }} assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/prepa-ja-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/prepa-ja-${{ steps.v.outputs.name }}.aab"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ steps.v.outputs.name }}
          path: dist/

      - name: Release GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Prépa JA ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Application Android Prépa JA Badminton, version ${{ steps.v.outputs.name }} (code ${{ steps.v.outputs.code }}).

            - `prepa-ja-${{ steps.v.outputs.name }}.apk` : à installer directement sur un téléphone Android (7.0 ou plus).
            - `prepa-ja-${{ steps.v.outputs.name }}.aab` : à déposer dans la Play Console (Production ou test interne).

            ${{ steps.key.outputs.official == 'true' && 'Signé avec la clé d''envoi Play Store du dépôt.' || '⚠️ Signé avec une clé de test : l''APK s''installe, mais l''AAB n''est pas accepté par le Play Store tant que les secrets ANDROID_KEYSTORE_* ne sont pas configurés (voir README).' }}
