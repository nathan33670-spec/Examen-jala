name: Contrôles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Dépendances Python
        run: pip install -r bot/requirements.txt

      - name: Contenu valide et fichiers générés à jour
        run: python scripts/build_site.py --check

      - name: Tests unitaires
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntaxe JavaScript
        run: for f in docs/js/*.js docs/sw.js; do node --check "$f"; done

      - name: Tests du moteur de questions et de la ludification
        run: node --test tests/engine.test.mjs

      - name: Tests de bout en bout (Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server -d docs 8765 &
          sleep 2
          node tests/smoke.mjs http://localhost:8765/
