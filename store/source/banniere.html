<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; color: #fff;
    background: linear-gradient(135deg, #2a63b0 0%, #1d4f91 45%, #163d72 100%); position: relative; }
  .txt { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 84px; height: 84px; border-radius: 18px; overflow: hidden; margin-bottom: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .logo img { width: 100%; height: 100%; display: block; }
  h1 { margin: 0; font-size: 56px; line-height: 1.05; letter-spacing: -.5px; }
  p.sub { margin: 14px 0 22px; font-size: 26px; color: #dbe6f6; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 21px; color: #eef3fb; }
  li { margin: 7px 0; padding-left: 26px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 9px; width: 11px; height: 11px; border-radius: 50%; background: #f28c28; }
  .phone { position: absolute; right: 70px; top: 38px; width: 236px; height: 470px; border-radius: 34px; background: #0e1726;
    padding: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.35); transform: rotate(4deg); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 26px; display: block; }
</style></head>
<body>
  <div class="txt">
    <div class="logo"><img src="icone.png" alt=""></div>
    <h1>Prépa JA Badminton</h1>
    <p class="sub">Juge-arbitre JALA · Arbitre ALA</p>
    <ul>
      <li>Plus de 2 300 questions corrigées</li>
      <li>Examens blancs chronométrés</li>
      <li>Règlements consultables hors ligne</li>
    </ul>
  </div>
  <div class="phone"><img src="../captures/02-accueil.png" alt=""></div>
</body></html>
